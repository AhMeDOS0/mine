<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Study Guide</title>
  <meta name="description" content="Interactive study guide viewer for Ahmed Command Center">
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: 'Segoe UI', system-ui, sans-serif; background: #010409; color: #c9d1d9; }
    .loader { display: flex; align-items: center; justify-content: center; min-height: 100vh; flex-direction: column; gap: 18px; }
    .loader-ring { width: 48px; height: 48px; border: 4px solid #21262d; border-top-color: #58a6ff; border-radius: 50%; animation: spin .8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loader-text { color: #8b949e; font-size: 14px; }
    .error { color: #f87171; background: #2e0c0c; border: 1px solid #ef444444; border-radius: 10px; padding: 20px; margin: 40px auto; max-width: 600px; text-align: center; }
    .back-btn { position: fixed; top: 16px; right: 16px; z-index: 100; padding: 8px 16px; border-radius: 8px; border: 1px solid #30363d; background: #161b22; color: #c9d1d9; cursor: pointer; font-weight: 600; font-size: 13px; transition: all .2s; text-decoration: none; }
    .back-btn:hover { background: #21262d; border-color: #58a6ff; color: #58a6ff; }
  </style>
</head>
<body>
  <a class="back-btn" href="index.html">← Back</a>
  <div id="root">
    <div class="loader">
      <div class="loader-ring"></div>
      <div class="loader-text">Loading guide...</div>
    </div>
  </div>

  <script>
    (async function() {
      const params = new URLSearchParams(window.location.search);
      const guide = params.get('guide');
      const guideMap = {
        'ds': { file: 'ds-guide.jsx', title: 'DS Guide' },
        'toc': { file: 'toc-guide.jsx', title: 'TOC Guide' }
      };

      // Check for custom guides stored in localStorage
      const customGuides = JSON.parse(localStorage.getItem('ahmed-custom-guides') || '{}');
      if (customGuides[guide]) {
        guideMap[guide] = { content: customGuides[guide].content, title: customGuides[guide].title };
      }

      const info = guideMap[guide];
      if (!info) {
        document.getElementById('root').innerHTML = '<div class="error"><h2>Guide not found</h2><p>No guide found for: ' + (guide||'(none)') + '</p></div>';
        return;
      }

      document.title = info.title + ' — Ahmed Command Center';

      try {
        let jsxCode;
        if (info.content) {
          jsxCode = info.content;
        } else {
          const res = await fetch(info.file);
          if (!res.ok) throw new Error('Failed to load ' + info.file);
          jsxCode = await res.text();
        }

        // Transform the JSX: replace ES module import with UMD global
        jsxCode = jsxCode.replace(/import\s*\{([^}]+)\}\s*from\s*["']react["']\s*;?/g, 'const {$1} = React;');
        // Remove any other imports
        jsxCode = jsxCode.replace(/import\s+.*from\s+["'].*["']\s*;?/g, '');
        // Replace export default with a global assignment
        jsxCode = jsxCode.replace(/export\s+default\s+function\s+(\w+)/g, 'function $1');

        // Add the render call
        jsxCode += `
          ;(function(){
            const root = ReactDOM.createRoot(document.getElementById('root'));
            const GuideApp = typeof DSGuide !== 'undefined' ? DSGuide
                           : typeof TOCGuide !== 'undefined' ? TOCGuide
                           : null;
            if (GuideApp) root.render(React.createElement(GuideApp));
            else document.getElementById('root').innerHTML = '<div class="error"><h2>No guide component found</h2></div>';
          })();
        `;

        // Create a script element with Babel transpilation
        const script = document.createElement('script');
        script.type = 'text/babel';
        script.textContent = jsxCode;
        document.body.appendChild(script);

        // Trigger Babel to process the new script
        window.Babel.transformScriptTags();
      } catch (err) {
        document.getElementById('root').innerHTML = '<div class="error"><h2>Error loading guide</h2><p>' + err.message + '</p></div>';
      }
    })();
  </script>
</body>
</html>
